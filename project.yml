name: HomeNetPulse
options:
  bundleIdPrefix: com.kristenadd
  deploymentTarget:
    iOS: "18.0"
    macOS: "15.0"
  createIntermediateGroups: true
settings:
  base:
    DEVELOPMENT_TEAM: B4H429V95D
    CODE_SIGN_STYLE: Automatic
    SWIFT_VERSION: "6.0"
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
targets:
  HomeNetPulse:
    type: application
    supportedDestinations: [iOS, macOS]
    sources: [HomeNetPulse]
    entitlements:
      path: HomeNetPulse/HomeNetPulse.entitlements
      properties:
        com.apple.security.app-sandbox: true
        com.apple.security.network.client: true
        com.apple.security.network.server: true
        com.apple.security.personal-information.location: true
    info:
      path: HomeNetPulse/Info.plist
      properties:
        CFBundleDisplayName: HomeNet Pulse
        LSUIElement: true
        LSApplicationCategoryType: public.app-category.utilities
        UILaunchScreen: {}
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait, UIInterfaceOrientationLandscapeLeft, UIInterfaceOrientationLandscapeRight]
        NSLocalNetworkUsageDescription: HomeNet Pulse discovers your AirPort base stations and checks the health of your router on the local network.
        NSBonjourServices: [_airport._tcp, _companion-link._tcp, _airplay._tcp, _raop._tcp, _googlecast._tcp, _hap._tcp, _sonos._tcp, _spotify-connect._tcp, _ipp._tcp, _printer._tcp, _smb._tcp, _ssh._tcp, _http._tcp, _matter._tcp, _amzn-wplay._tcp]
        NSLocationUsageDescription: HomeNet Pulse uses Location only so macOS reveals which Wi-Fi access point you're connected to. Your location is never stored or sent anywhere.
        NSLocationWhenInUseUsageDescription: HomeNet Pulse uses Location only so iOS reveals which Wi-Fi base station you're connected to. Your location is never stored or sent anywhere.
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.kristenadd.HomeNetPulse
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ENABLE_HARDENED_RUNTIME[sdk=macosx*]: YES
        TARGETED_DEVICE_FAMILY: "1,2"
        CODE_SIGN_ENTITLEMENTS[sdk=iphone*]: HomeNetPulse/HomeNetPulse-iOS.entitlements
  HomeNetPulseTests:
    type: bundle.unit-test
    supportedDestinations: [iOS, macOS]
    sources: [HomeNetPulseTests]
    dependencies:
      - target: HomeNetPulse
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        BUNDLE_LOADER: $(TEST_HOST)
        TEST_HOST[sdk=macosx*]: $(BUILT_PRODUCTS_DIR)/HomeNetPulse.app/Contents/MacOS/HomeNetPulse
        TEST_HOST[sdk=iphone*]: $(BUILT_PRODUCTS_DIR)/HomeNetPulse.app/HomeNetPulse
schemes:
  HomeNetPulse:
    build:
      targets:
        HomeNetPulse: all
    test:
      targets: [HomeNetPulseTests]
