# Builds, signs and releases HomeNet Pulse:
#   - Mac: Developer ID–signed, notarized and stapled DMG
#   - iPhone / iPad: ad-hoc .ipa for the team's registered devices, uploaded to Firebase App Distribution
# then tags vX.Y.Z and publishes a GitHub release with both. There is no in-app auto-update.
#
# Runs on every push to main (not for docs or local-only scripts), or by hand (Actions ▸ Release ▸
# Run workflow). One macOS job does everything, to keep the private repo's Actions minutes down.
#
# Versions: the next version after the newest vX.Y.Z tag (scripts/next-version.sh), patch + 1. Put
# #minor or #major in a commit message to bump that part, or raise MARKETING_VERSION in project.yml
# to jump ahead. The build number is the run number. "[skip release]" (or "[skip ci]") in the
# commit message pushes without a release.
#
# Secrets (Settings ▸ Secrets and variables ▸ Actions); ~/Projects/SigningSecrets sets all of them
# from the login keychain (repos.conf line kristenadd/HomeNetPulse):
#   DEVELOPER_ID_P12_BASE64, DEVELOPER_ID_P12_PASSWORD             Mac signing (Developer ID Application)
#   APPLE_DEVELOPMENT_P12_BASE64, APPLE_DEVELOPMENT_P12_PASSWORD   iOS archive (Apple Development)
#   APPLE_DISTRIBUTION_P12_BASE64, APPLE_DISTRIBUTION_P12_PASSWORD iOS ad-hoc export (Apple Distribution)
#   NOTARY_API_KEY_P8, NOTARY_API_KEY_ID, NOTARY_API_ISSUER_ID     App Store Connect API key: notarization,
#                                                                  provisioning profiles, device registration
#   FIREBASE_SERVICE_ACCOUNT_JSON                                  Firebase project homenet-pulse (App Distribution Admin)
# Variables:
#   IOS_BUNDLE_ID, FIREBASE_PROJECT_NUMBER, FIREBASE_IOS_APP_ID    set by SigningSecrets
#   FIREBASE_GROUPS   optional: tester group aliases to invite on every release (comma-separated)
#   XCODE_VERSION     optional, e.g. 27.2 (default: the newest Xcode on the runner)
#
# Firebase: testers open the invite on their iPhone / iPad, which registers its UDID; the next run
# adds it to the Apple account (fastlane sync_devices) before building, so the new .ipa installs on it.
name: Release

on:
  push:
    branches: [main]
    paths-ignore:
      - "**.md"
      - ".gitignore"
      - "scripts/install-*.sh"
      - "scripts/update-manuf.sh"
      - "scripts/convert-manuf.py"
      - "scripts/make-icon.swift"
  workflow_dispatch:
    inputs:
      bump:
        description: Version part to bump
        type: choice
        options: [patch, minor, major]
        default: patch
      firebase_groups:
        description: Firebase tester groups to invite (comma-separated aliases; empty = the FIREBASE_GROUPS variable)
        type: string
        default: ""
      sync_devices:
        description: Register the Firebase testers' devices with Apple first
        type: boolean
        default: true

# One release at a time, so two quick pushes can't claim the same version.
concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: write

env:
  APPLE_TEAM_ID: B4H429V95D
  NOTARY_PROFILE: HomeNetPulse-Notary

jobs:
  release:
    if: ${{ !contains(github.event.head_commit.message, '[skip release]') }}
    runs-on: macos-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0 # all tags and history, to work out the version

      - name: Work out the version
        env:
          BEFORE: ${{ github.event.before }}
          INPUT_BUMP: ${{ inputs.bump }}
        run: |
          bump="${INPUT_BUMP:-patch}"
          if [ "$GITHUB_EVENT_NAME" = push ]; then
            # Every commit in this push (falling back to the last one after a force-push).
            if git cat-file -e "$BEFORE^{commit}" 2>/dev/null; then range="$BEFORE..HEAD"; else range="-1 HEAD"; fi
            messages=$(git log --format=%B $range)
            if grep -q '#major' <<<"$messages"; then bump=major
            elif grep -q '#minor' <<<"$messages"; then bump=minor; fi
          fi
          version=$(scripts/next-version.sh "$bump")
          if git rev-parse -q --verify "refs/tags/v$version" >/dev/null; then
            echo "::error::Tag v$version already exists"; exit 1
          fi
          echo "Releasing $version ($bump bump), build $GITHUB_RUN_NUMBER"
          echo "VERSION=$version" >> "$GITHUB_ENV"
          echo "BUILD_NUMBER=$GITHUB_RUN_NUMBER" >> "$GITHUB_ENV"

      - name: Select Xcode
        run: |
          if [ -n "${{ vars.XCODE_VERSION }}" ]; then xcode="/Applications/Xcode_${{ vars.XCODE_VERSION }}.app"
          else xcode=$(ls -d /Applications/Xcode_*.app | grep -E '/Xcode_[0-9.]+\.app$' | sort -V | tail -1); fi
          sudo xcode-select -s "$xcode"
          xcodebuild -version

      - name: Check secrets
        env:
          DEVID: ${{ secrets.DEVELOPER_ID_P12_BASE64 }}
          DEV: ${{ secrets.APPLE_DEVELOPMENT_P12_BASE64 }}
          DIST: ${{ secrets.APPLE_DISTRIBUTION_P12_BASE64 }}
          KEY: ${{ secrets.NOTARY_API_KEY_P8 }}
        run: |
          for v in DEVID:DEVELOPER_ID_P12_BASE64 DEV:APPLE_DEVELOPMENT_P12_BASE64 DIST:APPLE_DISTRIBUTION_P12_BASE64 KEY:NOTARY_API_KEY_P8; do
            eval "[ -n \"\$${v%%:*}\" ]" || { echo "::error::${v#*:} isn't set (see the comment at the top of this workflow)"; exit 1; }
          done

      - name: Install the signing certificates and the API key
        env:
          DEVID_P12: ${{ secrets.DEVELOPER_ID_P12_BASE64 }}
          DEVID_PASSWORD: ${{ secrets.DEVELOPER_ID_P12_PASSWORD }}
          DEV_P12: ${{ secrets.APPLE_DEVELOPMENT_P12_BASE64 }}
          DEV_PASSWORD: ${{ secrets.APPLE_DEVELOPMENT_P12_PASSWORD }}
          DIST_P12: ${{ secrets.APPLE_DISTRIBUTION_P12_BASE64 }}
          DIST_PASSWORD: ${{ secrets.APPLE_DISTRIBUTION_P12_PASSWORD }}
          API_KEY_P8: ${{ secrets.NOTARY_API_KEY_P8 }}
          API_KEY_ID: ${{ secrets.NOTARY_API_KEY_ID }}
          API_ISSUER_ID: ${{ secrets.NOTARY_API_ISSUER_ID }}
        run: |
          keychain="$RUNNER_TEMP/release.keychain-db"
          keychain_password=$(openssl rand -base64 24)
          security create-keychain -p "$keychain_password" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$keychain_password" "$keychain"
          for pair in DEVID_P12:DEVID_PASSWORD DEV_P12:DEV_PASSWORD DIST_P12:DIST_PASSWORD; do
            eval "data=\$${pair%%:*}; password=\$${pair#*:}"
            printf '%s' "$data" | base64 --decode > "$RUNNER_TEMP/cert.p12"
            security import "$RUNNER_TEMP/cert.p12" -k "$keychain" -P "$password" -f pkcs12 \
              -T /usr/bin/codesign -T /usr/bin/security
            rm -P "$RUNNER_TEMP/cert.p12"
          done
          # Apple's intermediates: Developer ID (G2) for the Mac app, WWDR (G3) for development /
          # distribution. A .p12 may already include them, which reports a duplicate.
          for cer in DeveloperIDG2CA AppleWWDRCAG3; do
            curl -fsSL "https://www.apple.com/certificateauthority/$cer.cer" -o "$RUNNER_TEMP/$cer.cer"
            if ! output=$(security import "$RUNNER_TEMP/$cer.cer" -k "$keychain" 2>&1); then
              [[ "$output" == *"already exists"* ]] || { echo "$output"; exit 1; }
            fi
          done
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$keychain_password" "$keychain" >/dev/null
          security list-keychains -d user -s "$keychain" $(security list-keychains -d user | tr -d '"')
          security find-identity -v -p codesigning "$keychain"
          echo "KEYCHAIN=$keychain" >> "$GITHUB_ENV"

          printf '%s\n' "$API_KEY_P8" > "$RUNNER_TEMP/AuthKey.p8"
          chmod 600 "$RUNNER_TEMP/AuthKey.p8"
          xcrun notarytool store-credentials "$NOTARY_PROFILE" --keychain "$keychain" \
            --key "$RUNNER_TEMP/AuthKey.p8" --key-id "$API_KEY_ID" --issuer "$API_ISSUER_ID"

      - name: Set up fastlane
        if: vars.FIREBASE_PROJECT_NUMBER != ''
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"
          bundler-cache: true

      - name: Register the Firebase testers' devices
        if: vars.FIREBASE_PROJECT_NUMBER != '' && (github.event_name != 'workflow_dispatch' || inputs.sync_devices)
        env:
          FIREBASE_PROJECT_NUMBER: ${{ vars.FIREBASE_PROJECT_NUMBER }}
          FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}
          NOTARY_API_KEY_ID: ${{ secrets.NOTARY_API_KEY_ID }}
          NOTARY_API_ISSUER_ID: ${{ secrets.NOTARY_API_ISSUER_ID }}
          NOTARY_API_KEY_P8: ${{ secrets.NOTARY_API_KEY_P8 }}
        run: bundle exec fastlane ios sync_devices

      - name: Build the iPhone / iPad app
        env:
          ASC_KEY_PATH: ${{ runner.temp }}/AuthKey.p8
          ASC_KEY_ID: ${{ secrets.NOTARY_API_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.NOTARY_API_ISSUER_ID }}
        run: scripts/release-ios.sh

      - name: Build, sign and notarize the Mac app
        env:
          NOTARY_KEYCHAIN: ${{ env.KEYCHAIN }}
        run: scripts/release-mac.sh

      - name: Publish the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cd build/release
          dmg="HomeNetPulse-$VERSION.dmg" ipa="HomeNetPulse-$VERSION-ios.ipa"
          shasum -a 256 "$dmg" "$ipa" > "HomeNetPulse-$VERSION.sha256"
          ../../scripts/release-notes.sh "$VERSION" "$GITHUB_SHA" > notes.md
          gh release create "v$VERSION" "$dmg" "$ipa" "HomeNetPulse-$VERSION.sha256" \
            --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" \
            --title "HomeNet Pulse $VERSION" --notes-file notes.md

      - name: Upload to Firebase App Distribution
        if: vars.FIREBASE_IOS_APP_ID != ''
        env:
          FIREBASE_IOS_APP_ID: ${{ vars.FIREBASE_IOS_APP_ID }}
          FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}
          GROUPS: ${{ inputs.firebase_groups || vars.FIREBASE_GROUPS }}
        run: |
          notes="HomeNet Pulse $VERSION ($BUILD_NUMBER)
          $(sed -n 's/^- //p' build/release/notes.md | head -20)"
          bundle exec fastlane ios distribute ipa:"$PWD/build/release/HomeNetPulse-$VERSION-ios.ipa" \
            groups:"$GROUPS" notes:"$notes"

      - name: Remove the keychain and the API key
        if: always()
        run: |
          [ -n "${KEYCHAIN:-}" ] && security delete-keychain "$KEYCHAIN" || true
          rm -fP "$RUNNER_TEMP/AuthKey.p8"
